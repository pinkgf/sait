version: '3.8'

services:
  app:
    build: .
    ports:
      - "80:80"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=cash_system
      - DB_USER=cash_user
      - DB_PASS=12345678

  db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=cash_system
      - MYSQL_USER=cash_user
      - MYSQL_PASSWORD=12345678
      - MYSQL_ROOT_PASSWORD=root123
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db_data:
